name: Validate SELAH
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/validate.mjs
      - run: node tests/catalog-merge.mjs
      - run: node tests/service-model.mjs
      - run: node tests/song-submission.mjs
      - run: node --check assets/app.js
      - run: node --check assets/icons.js
      - run: node --check assets/content.js
      - run: node --check assets/service-model.js
      - run: node --check assets/service-templates.js
      - run: node --check assets/service-builder.js
      - run: node --check assets/song-submission.js
      - run: node --check sw.js
