name: Validate SELAH
on:
  push:
    branches-ignore: [cms/editorial]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tests/catalog-merge.mjs
      - run: node tests/public-catalog.mjs
      - run: node --check assets/catalog-sync.js
      - run: node --check assets/public-catalog.js
      - run: node tests/cms-content.mjs
      - run: node tests/cms-editorial.mjs
      - uses: actions/checkout@v4
        with:
          repository: pagescms/pagescms
          ref: 6f4e860a35d934406580287e7042e5e111e207a1
          path: .cms-upstream
          persist-credentials: false
      - run: node tests/pages-cms-upstream.mjs
        env:
          SELAH_PAGES_CMS_SOURCE: ${{ github.workspace }}/.cms-upstream
      - name: Check published content policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if [ -n "$BASE_SHA" ]; then
            git fetch origin "$BASE_SHA"
            node scripts/check-content.mjs --base "$BASE_SHA"
          else
            node scripts/check-content.mjs --base origin/main
          fi
      - run: node tests/validate.mjs
      - run: node tests/service-model.mjs
      - run: node tests/song-submission.mjs
      - run: node tests/service-song-picker.mjs
      - run: node --check assets/app.js
      - run: node --check assets/icons.js
      - run: node --check assets/content.js
      - run: node --check assets/service-model.js
      - run: node --check assets/service-templates.js
      - run: node --check assets/service-builder.js
      - run: node --check assets/service-song-picker.js
      - run: node --check assets/song-submission.js
      - run: node --check sw.js
